name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - name: Verify source and dependencies
        run: |
          test "$(git describe --tags --exact-match)" = "$GITHUB_REF_NAME"
          go mod verify
          go vet ./...
          CGO_ENABLED=0 go test ./...
      - name: Build release archives
        run: scripts/build-release.sh "$GITHUB_REF_NAME" dist
      - name: Verify host artifact identity
        run: |
          sha256sum --check dist/checksums.txt
          tar -xzf "dist/git-remote-cloak_${GITHUB_REF_NAME}_linux_amd64.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/git-remote-cloak" version
          test "$("$RUNNER_TEMP/git-remote-cloak" version --json | jq -r .version)" = "$GITHUB_REF_NAME"
          test "$("$RUNNER_TEMP/git-remote-cloak" version --json | jq -r .cgo)" = disabled
      - name: Publish immutable release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --verify-tag --generate-notes
